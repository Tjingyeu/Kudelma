[workspace]
members = ["crates/*"]
resolver = "3"

[package]
name = "kudelma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A fast Rust coding agent for the terminal"
default-run = "kudelma"

[dependencies]
clap.workspace = true
color-eyre.workspace = true
kudelma-acp.workspace = true
kudelma-config.workspace = true
kudelma-core.workspace = true
kudelma-permissions.workspace = true
kudelma-providers.workspace = true
kudelma-storage.workspace = true
kudelma-tools.workspace = true
kudelma-tui.workspace = true
rpassword.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Tjingyeu/Kudelma"

[workspace.dependencies]
kudelma-config = { path = "crates/kudelma-config" }
kudelma-storage = { path = "crates/kudelma-storage" }
kudelma-providers = { path = "crates/kudelma-providers" }
kudelma-permissions = { path = "crates/kudelma-permissions" }
kudelma-tools = { path = "crates/kudelma-tools" }
kudelma-core = { path = "crates/kudelma-core" }
kudelma-tui = { path = "crates/kudelma-tui" }
kudelma-acp = { path = "crates/kudelma-acp" }

async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
color-eyre = "0.6"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "7"
eventsource-stream = "0.2"
futures = "0.3"
globset = "0.4"
html-escape = "0.3"
ignore = "0.4"
libc = "0.2"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
